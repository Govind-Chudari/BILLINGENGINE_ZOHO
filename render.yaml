services:
  # Backend
  - type: web
    name: billflow-backend
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python app.py"
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MINIO_ENDPOINT
        value: "storage.googleapis.com"  # Use external S3 provider
      - key: DATABASE_URL
        fromDatabase:
          name: billflow-db
          property: connectionString

  # Frontend
  - type: web
    name: billflow-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/build
    routes:
      - type: rewrite
        source: /api/*
        destination: https://billflow-backend.onrender.com/*

databases:
  - name: billflow-db
    databaseName: billflow
    plan: free